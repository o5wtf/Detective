name: Сборка Android

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Код
        uses: actions/checkout@v4

      - name: Секреты не в git
        run: |
          set -euo pipefail
          if git ls-files | grep -E '(^|/)(dev\.cfg|export_credentials\.cfg|.+\.keystore|.+\.jks)$'; then
            echo "В репозитории лежит ключ или конфиг с секретом."
            exit 1
          fi

      - name: Godot 4.7.2 и шаблоны экспорта
        run: |
          set -euo pipefail
          version=4.7.2
          curl -fsSL -o "$RUNNER_TEMP/godot.zip" \
            "https://github.com/godotengine/godot/releases/download/${version}-stable/Godot_v${version}-stable_linux.x86_64.zip"
          unzip -q "$RUNNER_TEMP/godot.zip" -d "$RUNNER_TEMP/godot"
          install -m 755 "$RUNNER_TEMP/godot/Godot_v${version}-stable_linux.x86_64" /usr/local/bin/godot
          curl -fsSL -o "$RUNNER_TEMP/templates.tpz" \
            "https://github.com/godotengine/godot/releases/download/${version}-stable/Godot_v${version}-stable_export_templates.tpz"
          unzip -q "$RUNNER_TEMP/templates.tpz" -d "$RUNNER_TEMP/templates"
          template_version="$(tr -d '[:space:]' < "$RUNNER_TEMP/templates/templates/version.txt")"
          dest="$HOME/.local/share/godot/export_templates/${template_version}"
          mkdir -p "$dest"
          cp -a "$RUNNER_TEMP/templates/templates/." "$dest/"
          godot --version

      - name: Шаблон Android для кэша Gradle
        run: |
          set -euo pipefail
          source_zip="$(find "$HOME/.local/share/godot/export_templates" -name android_source.zip | head -1)"
          test -n "$source_zip"
          rm -rf android
          mkdir -p android/build
          unzip -q "$source_zip" -d android/build
          find android/build -name '*.gradle' -o -name '*.gradle.kts' -o -name 'gradle-wrapper.properties' -o -name '*.toml' | sort | head

      - name: Кэш Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-godot-4.7.2-${{ hashFiles('android/build/**/*.gradle*', 'android/build/**/*.gradle.kts', 'android/build/**/gradle-wrapper.properties', 'android/build/**/*.toml') }}
          restore-keys: |
            gradle-${{ runner.os }}-godot-4.7.2-

      - name: Тесты
        run: |
          set -euo pipefail
          godot --headless --path . --import
          godot --headless --path . -s res://tests/run_tests.gd

      - name: JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Пакеты SDK
        run: |
          set -euo pipefail
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platform-tools"
          sdkmanager "platforms;android-36" || sdkmanager "platforms;android-35"
          sdkmanager "build-tools;36.0.0" || sdkmanager "build-tools;35.0.0"
          test -d "$ANDROID_HOME/platform-tools"
          test -d "$ANDROID_HOME/build-tools"
          echo "JAVA_HOME=$JAVA_HOME"
          echo "ANDROID_HOME=$ANDROID_HOME"

      - name: Библиотека sherpa-onnx arm64
        run: |
          set -euo pipefail
          python3 tools/fetch_sherpa_android.py --self-test
          python3 tools/fetch_sherpa_android.py

      - name: Подпись Android и номер сборки
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          set -euo pipefail
          keystore="$RUNNER_TEMP/detective.keystore"
          alias="androiddebugkey"
          storepass="android"
          keypass="android"
          if [ -n "${ANDROID_KEYSTORE_BASE64}" ] && [ -n "${ANDROID_KEYSTORE_PASSWORD}" ] && [ -n "${ANDROID_KEY_PASSWORD}" ] && [ -n "${ANDROID_KEY_ALIAS}" ]; then
            printf '%s' "${ANDROID_KEYSTORE_BASE64}" | base64 -d > "$keystore"
            alias="${ANDROID_KEY_ALIAS}"
            storepass="${ANDROID_KEYSTORE_PASSWORD}"
            keypass="${ANDROID_KEY_PASSWORD}"
          else
            echo "::warning::Секреты подписи не заданы. Этот APK подписан одноразовым ключом и не встанет поверх установленной игры."
            keytool -genkeypair -keystore "$keystore" \
              -storepass "$storepass" -keypass "$keypass" \
              -alias "$alias" -keyalg RSA -keysize 2048 -validity 10000 \
              -dname "CN=Android Debug,O=Godot,C=US"
          fi
          keytool -list -keystore "$keystore" -storepass "$storepass" -alias "$alias" >/dev/null
          python3 tools/stamp_android_version.py export_presets.cfg "${GITHUB_RUN_NUMBER}"
          grep -q "version/code=${GITHUB_RUN_NUMBER}" export_presets.cfg
          grep -q 'package/unique_name="com.o5wtf.detective"' export_presets.cfg
          KS_PATH="$keystore" KS_ALIAS="$alias" KS_STORE="$storepass" KS_KEY="$keypass" \
            JAVA_HOME="${JAVA_HOME:-}" ANDROID_HOME="${ANDROID_HOME:-}" \
            python3 tools/write_android_signing.py
          echo "GODOT_ANDROID_KEYSTORE_DEBUG_PATH=${keystore}" >> "$GITHUB_ENV"
          echo "GODOT_ANDROID_KEYSTORE_DEBUG_USER=${alias}" >> "$GITHUB_ENV"
          echo "GODOT_ANDROID_KEYSTORE_RELEASE_PATH=${keystore}" >> "$GITHUB_ENV"
          echo "GODOT_ANDROID_KEYSTORE_RELEASE_USER=${alias}" >> "$GITHUB_ENV"

      - name: Экспорт
        run: |
          set -euo pipefail
          mkdir -p builds
          # Gradle-шаблон нужен, чтобы экспортный плагин вставил <queries> TTS_SERVICE.
          # Каталог android/ в gitignore: его собираем из шаблона Godot той же версии.
          source_zip="$(find "$HOME/.local/share/godot/export_templates" -name android_source.zip | head -1)"
          test -n "$source_zip"
          template_version="$(tr -d '[:space:]' < "$(dirname "$source_zip")/version.txt")"
          prepare_android() {
            rm -rf android
            mkdir -p android/build
            unzip -q "$source_zip" -d android/build
            printf '%s\n' "$template_version" > android/.build_version
            python3 tools/prefer_google_repos.py android/build
          }
          prepare_android
          attempt=1
          max_attempts=4
          until godot --headless --path . --export-release "Android" "$PWD/builds/Detective.apk"; do
            if [ "$attempt" -ge "$max_attempts" ]; then
              exit 1
            fi
            wait=$((30 * attempt))
            echo "Gradle не скачал зависимости, попытка $((attempt + 1)) из $max_attempts, пауза ${wait} с."
            sleep "$wait"
            attempt=$((attempt + 1))
            prepare_android
          done
          test -s builds/Detective.apk

      - name: В сборке нет ключа и лишних файлов
        run: |
          set -euo pipefail
          aapt="$(find "$ANDROID_HOME/build-tools" -type f -name aapt | sort | tail -1)"
          "$aapt" dump permissions builds/Detective.apk | tee "$RUNNER_TEMP/permissions.txt"
          grep -q android.permission.INTERNET "$RUNNER_TEMP/permissions.txt"
          "$aapt" dump xmltree builds/Detective.apk AndroidManifest.xml > "$RUNNER_TEMP/manifest.txt"
          if ! grep -q xlargeScreens "$RUNNER_TEMP/manifest.txt"; then
            echo "В манифесте нет больших экранов"
            grep -n -i screen "$RUNNER_TEMP/manifest.txt" | head -40
            exit 1
          fi
          if ! grep -q 'android.intent.action.TTS_SERVICE' "$RUNNER_TEMP/manifest.txt"; then
            echo "В манифесте нет запроса TTS_SERVICE"
            grep -n -i -E 'quer|intent|TTS' "$RUNNER_TEMP/manifest.txt" | head -40
            exit 1
          fi
          python3 tools/check_build.py builds/Detective.apk
          python3 tools/check_sherpa_apk.py builds/Detective.apk

      - name: Артефакты
        uses: actions/upload-artifact@v4
        with:
          name: detective-builds
          path: builds/Detective.apk
          if-no-files-found: error

      - name: Релиз по тегу
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: builds/Detective.apk
